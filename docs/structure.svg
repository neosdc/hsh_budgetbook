<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="structure-title structure-desc" id="structure-root">
        <title id="structure-title">hsh_budgetbook 폴더 구조</title>
        <desc id="structure-desc">저장소가 src, supabase/migrations, docs, .github/workflows 네 폴더로 나뉘고, src 안은 로그인·데이터 접근, 가계부 화면, 대시보드, 공용 계산 네 묶음으로 이루어진 폴더 구조.</desc>
